<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HGU Lab | Hokkai Gakuen University Baseball Lab
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Chart.js -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

</head>


<body>


<!-- ==========================================
     ヘッダー
========================================== -->

<header class="top-header">

    <div class="logo">

        <h1>
            HGU Lab
        </h1>

        <p>
            Hokkai Gakuen University Baseball Lab
        </p>

    </div>


    <div class="search-area">

        <input
            type="text"
            id="searchInput"
            placeholder="選手名で検索"
        >

    </div>

</header>



<!-- ==========================================
     ダークモード
========================================== -->

<button
    id="darkButton"
    type="button"
    aria-label="ダークモード切替"
>

    🌙

</button>



<!-- ==========================================
     フィルター
========================================== -->

<div class="filterBar">

    <select id="yearFilter">

        <option value="">
            年度
        </option>

    </select>


    <select id="tournamentFilter">

        <option value="">
            大会
        </option>

    </select>


    <select id="teamFilter">

        <option value="">
            相手
        </option>

    </select>


    <select id="handFilter">

        <option value="">
            左右投手
        </option>

        <option value="R">
            右投手
        </option>

        <option value="L">
            左投手
        </option>

    </select>


    <button
        id="filterButton"
        type="button"
    >

        検索

    </button>

</div>



<!-- ==========================================
     メイン
========================================== -->

<main id="content">


    <!-- ======================================
         ホーム
    ======================================= -->

    <section id="homePage">

        <div class="card">

            <h2>
                HGU Labへようこそ
            </h2>

            <p>
                北海学園大学硬式野球部の
                データ分析・管理システムです。
            </p>

            <p>
                CSV・JSONデータを更新することで、
                BASS・Rapsodo・Blastなどの
                データを表示できます。
            </p>

        </div>



        <!-- メニュー -->

        <div class="grid">


            <div
                class="menu-card"
                onclick="showPage('batters')"
            >

                <h3>
                    ⚾ 打者
                </h3>

                <p>
                    BASS・Rapsodo・Blast
                </p>

            </div>



            <div
                class="menu-card"
                onclick="showPage('pitchers')"
            >

                <h3>
                    🧢 投手
                </h3>

                <p>
                    BASS・Rapsodo
                </p>

            </div>



            <div
                class="menu-card"
                onclick="showPage('ranking')"
            >

                <h3>
                    📊 ランキング
                </h3>

                <p>
                    打率・OPS・防御率など
                </p>

            </div>


        </div>

    </section>



    <!-- ======================================
         選手ページ
    ======================================= -->

    <section
        id="playerPage"
        style="display: none;"
    >


        <!-- 選手プロフィール -->

        <div class="player-header">

            <h2 id="playerName">
                -
            </h2>

            <p id="playerTeam">
                -
            </p>

        </div>



        <!-- ==================================
             BASS
        =================================== -->

        <div class="card">

            <h3>
                📊 BASS成績
            </h3>

            <table class="stat-table">

                <tbody id="bassTable">

                </tbody>

            </table>

        </div>



        <!-- ==================================
             Rapsodo
        =================================== -->

        <div
            id="rapsodoArea"
            class="card"
        >

            <h3>
                📡 Rapsodo
            </h3>

            <table class="stat-table">

                <tbody id="rapsodoTable">

                </tbody>

            </table>

        </div>



        <!-- ==================================
             Blast
        =================================== -->

        <div class="card">

            <h3>
                💥 Blast
            </h3>

            <table class="stat-table">

                <tbody id="blastTable">

                </tbody>

            </table>

        </div>



        <!-- ==================================
             グラフ
        =================================== -->

        <div class="card">

            <h3>
                📈 分析グラフ
            </h3>

            <div class="chart-container">

                <canvas
                    id="playerChart"
                ></canvas>

            </div>

        </div>


    </section>


</main>



<!-- ==========================================
     ボトムナビ
========================================== -->

<nav class="bottom-nav">

    <button
        type="button"
        onclick="showPage('home')"
    >

        🏠
        ホーム

    </button>


    <button
        type="button"
        onclick="showPage('batters')"
    >

        ⚾
        打者

    </button>


    <button
        type="button"
        onclick="showPage('pitchers')"
    >

        🧢
        投手

    </button>


    <button
        type="button"
        onclick="showPage('ranking')"
    >

        📊
        ランキング

    </button>

</nav>



<!-- ==========================================
     JavaScript
========================================== -->


<!-- CSV -->

<script
    src="js/csvLoader.js"
></script>


<!-- JSON -->

<script
    src="js/jsonLoader.js"
></script>

<script
    src="js/jsonAnalyzer.js"
></script>


<!-- BASS -->

<script
    src="js/bassAnalyzer.js"
></script>


<!-- Rapsodo -->

<script
    src="js/rapsodoLoader.js"
></script>

<script
    src="js/rapsodoAnalyzer.js"
></script>


<!-- グラフ -->

<script
    src="js/chartManager.js"
></script>


<!-- ヒートマップ -->

<script
    src="js/heatmap.js"
></script>


<!-- 打球方向 -->

<script
    src="js/sprayChart.js"
></script>


<!-- 選手 -->

<script
    src="js/player.js"
></script>


<!-- アプリ本体 -->

<script
    src="js/app.js"
></script>



<!-- ==========================================
     ダークモード処理
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const darkButton =
            document.getElementById(
                "darkButton"
            );


        if (!darkButton) {

            return;

        }


        darkButton.addEventListener(
            "click",
            function () {

                document.body.classList.toggle(
                    "dark"
                );

            }
        );

    }
);

</script>


</body>

</html>
