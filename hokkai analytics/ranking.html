<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HGU Lab | Rankings
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- ==========================================
     ヘッダー
========================================== -->

<header class="top-header">

    <div class="logo">

        <h1>
            HGU Lab
        </h1>

        <p>
            Hokkai Gakuen University Baseball Lab
        </p>

    </div>

</header>



<!-- ==========================================
     メイン
========================================== -->

<main>


    <div class="card">

        <div class="player-header">

            <h2>
                🏆 ランキング
            </h2>

            <p>
                北海学園大学硬式野球部
            </p>

        </div>



        <!-- ==================================
             検索
        =================================== -->

        <div class="searchBox">

            <input
                type="text"
                id="searchPlayer"
                placeholder="選手名・チーム名で検索"
                onkeyup="searchRanking()"
            >

        </div>



        <!-- ==================================
             ランキング切替
        =================================== -->

        <div class="ranking-menu">

            <button
                type="button"
                onclick="showRanking('avg')"
            >
                打率
            </button>


            <button
                type="button"
                onclick="showRanking('ops')"
            >
                OPS
            </button>


            <button
                type="button"
                onclick="showRanking('hr')"
            >
                本塁打
            </button>


            <button
                type="button"
                onclick="showRanking('era')"
            >
                防御率
            </button>


            <button
                type="button"
                onclick="showRanking('so')"
            >
                奪三振
            </button>

        </div>



        <!-- ==================================
             ランキング表示
        =================================== -->

        <div
            id="rankingList"
            class="fade-in"
        >

            <p>
                ランキングを読み込んでいます...
            </p>

        </div>

    </div>


</main>



<!-- ==========================================
     ボトムナビ
========================================== -->

<nav class="bottom-nav">

    <button
        type="button"
        onclick="location.href='index.html'"
    >

        🏠
        ホーム

    </button>


    <button
        type="button"
        onclick="showRanking('avg')"
    >

        ⚾
        打者

    </button>


    <button
        type="button"
        onclick="location.href='index.html'"
    >

        🧢
        投手

    </button>


    <button
        type="button"
        onclick="location.href='ranking.html'"
    >

        📊
        ランキング

    </button>

</nav>



<!-- ==========================================
     JavaScript
========================================== -->


<!-- Papa Parse -->

<script
    src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"
></script>


<!-- BASS -->

<script
    src="js/bassAnalyzer.js"
></script>


<!-- CSV -->

<script
    src="js/csvLoader.js"
></script>


<!-- Ranking -->

<script
    src="js/ranking.js"
></script>



</body>

</html>
