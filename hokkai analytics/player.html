<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HBAS Player</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<header class="topHeader">

    <h1 id="playerName">Player</h1>

</header>

<div class="container">

    <!-- プロフィール -->
    <div class="card" id="profileCard">

        <div class="profile">

            <img src="assets/default.png" id="playerImage">

            <div>

                <h2 id="name"></h2>

                <p id="team"></p>

                <p id="position"></p>

            </div>

        </div>

    </div>

    <!-- BASS -->

    <div class="card">

        <h2>📊 BASS</h2>

        <div id="bassStats"></div>

    </div>

    <!-- Rapsodo -->

    <div class="card">

        <h2>⚾ Rapsodo</h2>

        <div id="rapsodoStats"></div>

    </div>

    <!-- Blast -->

    <div class="card">

        <h2>💥 Blast Motion</h2>

        <div id="blastStats"></div>

    </div>

    <!-- JSON -->

    <div class="card">

        <h2>📂 BACS</h2>

        <div id="jsonStats"></div>

    </div>

    <div>
        <h2> コース別打率</h2>
        <div id="zoneAverage"></div>
    </div>

    <!-- コース -->

    <div class="card">

        <h2>🎯 Pitch Location</h2>

        <canvas id="heatmapCanvas"></canvas>

    </div>

    <!-- スプレーチャート -->

    <div class="card">

        <h2>🗺️ Spray Chart</h2>

        <canvas id="sprayCanvas"></canvas>

    </div>

    <!-- 打球方向 -->

    <div class="card">

        <h2>📈 打球方向</h2>

        <canvas id="directionChart"></canvas>

    </div>

    <!-- 球種割合 -->

    <div class="card">

        <h2>⚾ 球種割合</h2>

        <canvas id="pitchChart"></canvas>

    </div>

</div>

<script src="js/bassAnalyzer.js"></script>
<script src="js/bacsAnalyzer.js"></script>
<script src="js/rapsodoAnalyzer.js"></script>
<script src="js/blastAnalyzer.js"></script>
<script src="js/heatmap.js"></script>
<script src="js/sprayChart.js"></script>
<script src="js/chartManager.js"></script>
<script src="js/player.js"></script>

</body>

</html>
